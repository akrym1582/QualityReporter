name: C# Unit Tests

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.x" }
      - name: Run C# unit tests
        run: dotnet test csharp/QualityReporter.CSharp.slnx

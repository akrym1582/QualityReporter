name: Quality Report
on:
  workflow_dispatch:
  schedule:
    - cron: "0 20 * * 5"
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.x" }
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - run: dotnet test csharp/QualityReporter.CSharp.slnx --collect:"XPlat Code Coverage"
      - run: dotnet run --project csharp/src/QualityReporter.CSharp -- analyze --solution csharp/QualityReporter.CSharp.slnx --output reports/csharp.json --markdown reports/csharp.md
      - run: npm ci && npm run coverage && npm run build
        working-directory: typescript
      - run: node typescript/dist/cli.js analyze --root typescript --output reports/typescript.json --markdown reports/typescript.md
      - run: cat reports/csharp.md reports/typescript.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with: { name: quality-report, path: reports/ }

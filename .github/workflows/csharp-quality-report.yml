name: C# Quality Report

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 20 * * 5"

permissions:
  contents: read
  pull-requests: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.x" }
      - name: Generate C# quality report
        run: |
          mkdir -p reports
          dotnet run --project csharp/src/QualityReporter.CSharp -- analyze \
            --solution csharp/QualityReporter.CSharp.slnx \
            --output reports/csharp.json \
            --markdown reports/csharp.md
      - name: Add report to job summary
        run: cat reports/csharp.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload C# quality report
        uses: actions/upload-artifact@v4
        with:
          name: csharp-quality-report
          path: |
            reports/csharp.json
            reports/csharp.md
      - name: Comment C# report on pull request
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          REPORT_PATH: reports/csharp.md
          COMMENT_MARKER: "<!-- quality-report:csharp -->"
        with:
          script: |
            const fs = require('fs');
            const marker = process.env.COMMENT_MARKER;
            const report = fs.readFileSync(process.env.REPORT_PATH, 'utf8');
            const body = `${marker}\n## C# quality report\n\n${report}`.slice(0, 65000);
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100
            });
            const existing = comments.find(comment =>
              comment.user.type === 'Bot' && comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body
              });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
